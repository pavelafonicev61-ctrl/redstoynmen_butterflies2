name: Build Fabric Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Установить Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Собрать мод
        run: gradle build

      - name: Загрузить JAR
        uses: actions/upload-artifact@v4
        with:
          name: redstoynmen-butterflies
          path: build/libs/*.jar
